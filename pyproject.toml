[build-system]
requires = ["setuptools>=61.0", "grpcio-tools"]
build-backend = "setuptools.build_meta"

[project]
name = "xbin-orchestrator"
version = "0.2.0"
description = "A blackboard-style orchestrator for binary analysis workers"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "xbin developers" }
]
dependencies = [
    "grpcio>=1.62.0",
    "grpcio-tools>=1.62.0",
    "redis==5.0.1",
    "fastapi==0.104.1",
    "uvicorn==0.24.0",
    "requests==2.31.0",
    "python-multipart==0.0.6",
    "argcomplete>=3.0.0",
]

[project.scripts]
xbin-orchestrator = "xbin_orchestrator.main:main"
xbin-preflight = "xbin_orchestrator.preflight:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Default lane is Docker-free: exclude the full-stack e2e test and the readiness
# checks, both of which need Docker and a live Redis. Run them with `pytest -m
# e2e` / `pytest -m preflight` (a user-supplied -m overrides this default).
addopts = "-ra -m 'not e2e and not preflight'"
markers = [
    "e2e: full-stack pipeline; needs Docker plus whatever base images and services the installed plugins declare. Opt-in.",
    "preflight: deployment readiness (Docker, Redis, base images, services). Opt-in.",
    "slow: long-running (minutes to hours).",
]
